<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WellSynth — Ingest</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #161a22;
      --panel-2: #1d222c;
      --border: #262d39;
      --text: #e6e9ef;
      --muted: #8a93a6;
      --accent: #5b8cff;
      --ok: #4ade80;
      --warn: #fbbf24;
      --bad: #f87171;
      --info: #60a5fa;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
    }
    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 16px;
      background: var(--panel);
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    header nav a {
      color: var(--muted); text-decoration: none; padding: 6px 10px;
      border-radius: 6px; font-size: 13px;
    }
    header nav a.active { color: var(--text); background: var(--panel-2); }
    header nav a:hover { color: var(--text); }
    header .sub { color: var(--muted); font-size: 12px; margin-left: auto; }

    main {
      flex: 1; overflow-y: auto; padding: 20px;
      max-width: 1100px; margin: 0 auto; width: 100%;
      display: flex; flex-direction: column; gap: 20px;
    }

    section {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px;
    }
    section h2 {
      margin: 0 0 12px; font-size: 13px; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* Drop zone */
    .drop {
      border: 2px dashed var(--border); border-radius: 10px;
      padding: 32px; text-align: center; cursor: pointer;
      transition: all .15s ease;
    }
    .drop:hover, .drop.over {
      border-color: var(--accent); background: rgba(91,140,255,.05);
    }
    .drop p { margin: 4px 0; }
    .drop .hint { color: var(--muted); font-size: 12px; }
    .drop input { display: none; }

    .file-list {
      margin-top: 12px; display: flex; flex-direction: column; gap: 6px;
    }
    .file-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--panel-2); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 6px; font-size: 13px;
    }
    .file-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-row .size { color: var(--muted); font-size: 11px; }
    .file-row button {
      background: transparent; color: var(--bad); border: none; cursor: pointer;
      font-size: 16px; padding: 0 4px;
    }

    .actions { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
    button.primary {
      background: var(--accent); color: white; border: none;
      padding: 8px 18px; border-radius: 6px; font-weight: 600; cursor: pointer;
      font-size: 13px;
    }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary {
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--border); padding: 6px 12px;
      border-radius: 6px; cursor: pointer; font-size: 12px;
    }
    button.secondary:hover { border-color: var(--accent); }

    .progress {
      height: 6px; background: var(--panel-2); border-radius: 3px;
      overflow: hidden; margin-top: 12px; display: none;
    }
    .progress.active { display: block; }
    .progress > div { height: 100%; background: var(--accent); width: 0%; transition: width .15s linear; }

    /* Jobs table */
    table.jobs { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.jobs th, table.jobs td {
      text-align: left; padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }
    table.jobs th {
      color: var(--muted); font-weight: 600; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    table.jobs tr:hover td { background: var(--panel-2); }
    table.jobs td.filename { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    table.jobs td.jobid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--muted); }
    table.jobs tr.fresh td { animation: flash 1.5s ease-out; }
    @keyframes flash {
      from { background: rgba(91,140,255,.18); }
      to   { background: transparent; }
    }
    table.jobs tr.expanded td { background: var(--panel-2); }
    .detail-row td { padding: 0 !important; }
    .detail-panel {
      padding: 10px 14px; font-size: 12px; color: var(--muted);
      background: #0c0e13; border-top: 1px solid var(--border);
    }
    .detail-panel .grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr));
      gap: 6px 16px; margin-bottom: 6px;
    }
    .detail-panel .k { color: var(--muted); }
    .detail-panel .v { color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .detail-panel pre {
      background: var(--panel); padding: 8px; border-radius: 4px;
      max-height: 200px; overflow: auto; margin: 6px 0;
      font-size: 10px; color: var(--muted);
    }

    .status {
      display: inline-block; font-size: 10px; padding: 2px 8px;
      border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px;
      font-weight: 600;
    }
    .status.completed   { background: rgba(74,222,128,.15);  color: var(--ok); }
    .status.failed      { background: rgba(248,113,113,.15); color: var(--bad); }
    .status.processing,
    .status.in_progress { background: rgba(96,165,250,.15);  color: var(--info); }
    .status.pending     { background: rgba(251,191,36,.15);  color: var(--warn); }

    .pbar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; min-width: 120px; }
    .pbar > div { height: 100%; background: var(--accent); transition: width .4s ease; }
    .pbar.active > div {
      background: linear-gradient(90deg, var(--accent), #8ab2ff, var(--accent));
      background-size: 200% 100%;
      animation: stripe 1.4s linear infinite;
    }
    @keyframes stripe { from { background-position: 200% 0; } to { background-position: 0 0; } }
    .ppct { font-size: 11px; color: var(--text); margin-top: 2px; }
    .ppct .eta { color: var(--muted); margin-left: 6px; }

    .expand-btn {
      background: transparent; border: none; color: var(--muted);
      cursor: pointer; font-size: 14px; padding: 0 4px; line-height: 1;
    }
    .expand-btn:hover { color: var(--accent); }

    .empty { text-align: center; color: var(--muted); padding: 24px; font-size: 13px; }
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--panel); border: 1px solid var(--border);
      padding: 10px 14px; border-radius: 8px; font-size: 13px;
      box-shadow: 0 4px 12px rgba(0,0,0,.4);
      max-width: 360px; z-index: 100;
    }
    .toast.ok  { border-color: var(--ok); }
    .toast.bad { border-color: var(--bad); }

    code.inline {
      background: var(--panel-2); padding: 1px 5px; border-radius: 3px;
      font-size: 11px; color: var(--accent);
    }

    .copy-btn {
      background: transparent; border: none; color: var(--muted);
      cursor: pointer; font-size: 11px; padding: 0 4px;
    }
    .copy-btn:hover { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>WellSynth Ingest</h1>
    <nav>
      <a href="/ingest-ui" class="active">Ingest</a>
      <a href="/ui">Chat</a>
    </nav>
    <span class="sub" id="conn-status">connecting…</span>
  </header>

  <main>
    <section>
      <h2>Upload PDFs</h2>
      <label class="drop" id="drop">
        <input type="file" id="file-input" accept="application/pdf" multiple />
        <p><strong>Click to choose</strong> or drag &amp; drop PDF files here</p>
        <p class="hint">Up to 20 files per batch · max 500 MB each</p>
      </label>

      <div class="file-list" id="file-list"></div>

      <div class="actions">
        <button class="primary" id="upload-btn" disabled>Upload &amp; ingest</button>
        <button class="secondary" id="clear-btn" disabled>Clear</button>
        <span class="sub" id="upload-status"></span>
      </div>

      <div class="progress" id="progress"><div></div></div>
    </section>

    <section>
      <h2>
        Recent jobs
        <button class="secondary" id="refresh-btn" style="float:right; margin-top:-4px;">Refresh</button>
      </h2>
      <div id="jobs-container"></div>
    </section>
  </main>

  <div id="toast" class="toast" style="display:none"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const dropEl     = $("drop");
    const fileInput  = $("file-input");
    const fileListEl = $("file-list");
    const uploadBtn  = $("upload-btn");
    const clearBtn   = $("clear-btn");
    const progressEl = $("progress");
    const progressBar= progressEl.firstElementChild;
    const uploadStatus = $("upload-status");
    const jobsContainer = $("jobs-container");
    const refreshBtn = $("refresh-btn");
    const connStatus = $("conn-status");
    const toastEl = $("toast");

    let pendingFiles = [];

    function fmtBytes(n) {
      if (!n) return "—";
      n = +n;
      if (n < 1024) return n + " B";
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
      if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + " MB";
      return (n / 1024 / 1024 / 1024).toFixed(2) + " GB";
    }

    function escapeHTML(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    function toast(msg, kind="ok") {
      toastEl.className = "toast " + kind;
      toastEl.textContent = msg;
      toastEl.style.display = "block";
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toastEl.style.display = "none", 4500);
    }

    function refreshFileList() {
      fileListEl.innerHTML = "";
      pendingFiles.forEach((f, i) => {
        const row = document.createElement("div");
        row.className = "file-row";
        row.innerHTML = `
          <span>📄</span>
          <span class="name">${escapeHTML(f.name)}</span>
          <span class="size">${fmtBytes(f.size)}</span>
          <button title="Remove" data-i="${i}">✕</button>
        `;
        row.querySelector("button").addEventListener("click", () => {
          pendingFiles.splice(i, 1);
          refreshFileList();
        });
        fileListEl.appendChild(row);
      });
      const has = pendingFiles.length > 0;
      uploadBtn.disabled = !has;
      clearBtn.disabled = !has;
    }

    function addFiles(fileList) {
      for (const f of fileList) {
        if (!/\.pdf$/i.test(f.name)) {
          toast(`Skipped ${f.name} (not a PDF)`, "bad");
          continue;
        }
        // Dedupe by name+size
        if (pendingFiles.some(p => p.name === f.name && p.size === f.size)) continue;
        pendingFiles.push(f);
      }
      refreshFileList();
    }

    fileInput.addEventListener("change", (e) => addFiles(e.target.files));
    dropEl.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropEl.classList.add("over");
    });
    dropEl.addEventListener("dragleave", () => dropEl.classList.remove("over"));
    dropEl.addEventListener("drop", (e) => {
      e.preventDefault();
      dropEl.classList.remove("over");
      addFiles(e.dataTransfer.files);
    });
    clearBtn.addEventListener("click", () => {
      pendingFiles = [];
      fileInput.value = "";
      refreshFileList();
    });

    uploadBtn.addEventListener("click", upload);

    function upload() {
      if (!pendingFiles.length) return;
      const fd = new FormData();
      for (const f of pendingFiles) fd.append("files", f);

      uploadBtn.disabled = true;
      clearBtn.disabled = true;
      progressEl.classList.add("active");
      progressBar.style.width = "0%";
      uploadStatus.textContent = "uploading…";

      const xhr = new XMLHttpRequest();
      xhr.open("POST", "/ingest/upload");
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          progressBar.style.width = ((e.loaded / e.total) * 100).toFixed(1) + "%";
        }
      };
      xhr.onload = () => {
        progressEl.classList.remove("active");
        uploadBtn.disabled = false;
        clearBtn.disabled = false;
        if (xhr.status >= 200 && xhr.status < 300) {
          let resp;
          try { resp = JSON.parse(xhr.responseText); } catch { resp = {}; }
          const n = resp.total ?? pendingFiles.length;
          (resp.jobs || []).forEach(j => { if (j.job_id) freshJobs.add(j.job_id); });
          toast(`Dispatched ${n} job(s) — processing in the background`, "ok");
          uploadStatus.textContent = `dispatched ${n}`;
          pendingFiles = [];
          fileInput.value = "";
          refreshFileList();
          loadJobs();
        } else {
          let detail = xhr.responseText;
          try { detail = JSON.parse(xhr.responseText).detail || detail; } catch {}
          toast(`Upload failed (${xhr.status}): ${String(detail).slice(0,200)}`, "bad");
          uploadStatus.textContent = `error ${xhr.status}`;
        }
      };
      xhr.onerror = () => {
        progressEl.classList.remove("active");
        uploadBtn.disabled = false;
        clearBtn.disabled = false;
        toast("Network error during upload", "bad");
        uploadStatus.textContent = "network error";
      };
      xhr.send(fd);
    }

    // ---- Jobs table ----

    // Track newly dispatched jobs so we can highlight them on first render.
    const freshJobs = new Set();
    // Track which jobs the user has expanded for detail.
    const expanded = new Set();
    // Track first-seen wallclock so we can compute an ETA.
    const firstSeen = new Map();   // job_id -> { ts, pages }

    function statusClass(s) {
      if (!s) return "";
      const k = String(s).toLowerCase();
      if (k.includes("complete")) return "completed";
      if (k.includes("fail") || k.includes("error")) return "failed";
      if (k.includes("pend"))     return "pending";
      return "processing";
    }

    function isTerminal(s) {
      const k = String(s||"").toLowerCase();
      return k.includes("complete") || k.includes("fail") || k.includes("error");
    }

    function fmtDuration(ms) {
      if (ms == null || !isFinite(ms) || ms < 0) return "—";
      const s = Math.round(ms / 1000);
      if (s < 60) return `${s}s`;
      const m = Math.floor(s / 60), rem = s % 60;
      if (m < 60) return `${m}m ${rem}s`;
      const h = Math.floor(m / 60), rm = m % 60;
      return `${h}h ${rm}m`;
    }

    function computeEta(job) {
      const total = +job.total_pages || 0;
      const done  = +job.pages_processed || 0;
      if (!total || done <= 0 || done >= total) return null;
      const seen = firstSeen.get(job.job_id);
      const now = Date.now();
      if (!seen) {
        firstSeen.set(job.job_id, { ts: now, pages: done });
        return null;
      }
      const dt = now - seen.ts;
      const dp = done - seen.pages;
      if (dp <= 0 || dt < 1500) return null;
      const rate = dp / dt;          // pages per ms
      const remaining = (total - done) / rate;
      return remaining;
    }

    function jobRow(job) {
      const total = +job.total_pages || 0;
      const done  = +job.pages_processed || 0;
      const pct = total > 0 ? Math.min(100, (done/total)*100) : 0;
      const sCls = statusClass(job.status);
      const active = !isTerminal(job.status);
      const eta = active ? computeEta(job) : null;
      const phaseLine = job.current_phase
        ? `<div class="size">${escapeHTML(job.current_phase)}</div>` : "";

      const progress = total > 0
        ? `<div class="pbar ${active ? 'active' : ''}"><div style="width:${pct.toFixed(1)}%"></div></div>
           <div class="ppct">${done}/${total} <span style="color:var(--muted)">·</span> ${pct.toFixed(0)}%${
             eta != null ? `<span class="eta">~${fmtDuration(eta)} left</span>` : ""
           }</div>`
        : (active
            ? `<div class="pbar active"><div style="width:8%"></div></div><div class="size">starting…</div>`
            : `<div class="size">—</div>`);

      const jid = job.job_id || "";
      const isExpanded = expanded.has(jid);
      const isFresh    = freshJobs.has(jid);
      const main = `
        <tr class="${isFresh ? 'fresh' : ''} ${isExpanded ? 'expanded' : ''}" data-jid="${escapeHTML(jid)}">
          <td>
            <button class="expand-btn" data-jid="${escapeHTML(jid)}">${isExpanded ? '▾' : '▸'}</button>
          </td>
          <td class="filename" title="${escapeHTML(job.filename||"")}">
            ${escapeHTML(job.filename||"")}
            ${job.doc_name && job.doc_name !== job.filename
              ? `<div class="size">doc: ${escapeHTML(job.doc_name)}</div>` : ""}
          </td>
          <td><span class="status ${sCls}">${escapeHTML(job.status||"")}</span>${phaseLine}</td>
          <td>${progress}</td>
          <td class="jobid">
            <code class="inline">${escapeHTML(jid.slice(0,8))}…</code>
            <button class="copy-btn" data-jid="${escapeHTML(jid)}" title="Copy job_id">⧉</button>
          </td>
          <td>
            <button class="secondary chat-btn" data-jid="${escapeHTML(jid)}" data-doc="${escapeHTML(job.doc_name||"")}" ${active ? 'disabled title="Wait until ingestion completes"' : ''}>Chat with this</button>
          </td>
        </tr>`;

      const detail = isExpanded ? `
        <tr class="detail-row"><td colspan="6">
          <div class="detail-panel">
            <div class="grid">
              <div><div class="k">job_id</div><div class="v">${escapeHTML(jid)}</div></div>
              <div><div class="k">doc_name</div><div class="v">${escapeHTML(job.doc_name||'—')}</div></div>
              <div><div class="k">status</div><div class="v">${escapeHTML(job.status||'—')}</div></div>
              <div><div class="k">phase</div><div class="v">${escapeHTML(job.current_phase||'—')}</div></div>
              <div><div class="k">started</div><div class="v">${escapeHTML(job.started_at||'—')}</div></div>
              <div><div class="k">finished</div><div class="v">${escapeHTML(job.finished_at||'—')}</div></div>
              <div><div class="k">pages</div><div class="v">${done} / ${total || '?'}</div></div>
              <div><div class="k">size</div><div class="v">${fmtBytes(job.size_bytes)}</div></div>
            </div>
            ${job.error
              ? `<div class="k" style="color:var(--bad)">error</div><pre>${escapeHTML(String(job.error))}</pre>` : ""}
            ${job.stats ? `<div class="k">stats</div><pre>${escapeHTML(JSON.stringify(job.stats, null, 2))}</pre>` : ""}
            ${job.phase_timings_ms ? `<div class="k">phase timings (ms)</div><pre>${escapeHTML(JSON.stringify(job.phase_timings_ms, null, 2))}</pre>` : ""}
          </div>
        </td></tr>` : "";

      return main + detail;
    }

    async function loadJobs() {
      try {
        const r = await fetch("/ingest");
        if (!r.ok) {
          jobsContainer.innerHTML = `<div class="empty">Failed to load jobs (${r.status})</div>`;
          return;
        }
        const data = await r.json();
        const jobs = data.jobs || [];
        if (!jobs.length) {
          jobsContainer.innerHTML = `<div class="empty">No ingestion jobs yet. Upload a PDF above to get started.</div>`;
          return;
        }
        jobsContainer.innerHTML = `
          <table class="jobs">
            <thead><tr>
              <th style="width:24px"></th><th>Filename</th><th>Status</th>
              <th style="min-width:180px">Progress</th><th>Job ID</th><th></th>
            </tr></thead>
            <tbody>${jobs.map(jobRow).join("")}</tbody>
          </table>`;

        // Clear "fresh" highlight after first paint.
        if (freshJobs.size) {
          setTimeout(() => freshJobs.clear(), 1600);
        }

        jobsContainer.querySelectorAll(".copy-btn").forEach(b => {
          b.addEventListener("click", async (ev) => {
            ev.stopPropagation();
            try {
              await navigator.clipboard.writeText(b.dataset.jid);
              toast("job_id copied");
            } catch {
              toast("clipboard unavailable", "bad");
            }
          });
        });
        jobsContainer.querySelectorAll(".chat-btn").forEach(b => {
          b.addEventListener("click", (ev) => {
            ev.stopPropagation();
            if (b.disabled) return;
            const jid = b.dataset.jid;
            const doc = b.dataset.doc;
            const hash = doc
              ? `#job=${encodeURIComponent(jid)}&doc=${encodeURIComponent(doc)}`
              : `#job=${encodeURIComponent(jid)}`;
            window.location.href = `/ui${hash}`;
          });
        });
        jobsContainer.querySelectorAll(".expand-btn").forEach(b => {
          b.addEventListener("click", (ev) => {
            ev.stopPropagation();
            const jid = b.dataset.jid;
            if (expanded.has(jid)) expanded.delete(jid);
            else expanded.add(jid);
            loadJobs();
          });
        });

        // Decide poll cadence based on whether any job is still working.
        const anyActive = jobs.some(j => !isTerminal(j.status));
        scheduleNextPoll(anyActive ? 1500 : 8000);
      } catch (e) {
        jobsContainer.innerHTML = `<div class="empty">Error: ${escapeHTML(String(e))}</div>`;
        scheduleNextPoll(5000);
      }
    }

    let _pollTimer = null;
    function scheduleNextPoll(ms) {
      if (_pollTimer) clearTimeout(_pollTimer);
      _pollTimer = setTimeout(loadJobs, ms);
    }

    refreshBtn.addEventListener("click", () => {
      if (_pollTimer) clearTimeout(_pollTimer);
      loadJobs();
    });

    // Probe service health on load
    (async () => {
      try {
        const r = await fetch("/");
        connStatus.textContent = r.ok ? "connected" : `error ${r.status}`;
        connStatus.style.color = r.ok ? "var(--ok)" : "var(--bad)";
      } catch {
        connStatus.textContent = "offline";
        connStatus.style.color = "var(--bad)";
      }
    })();

    loadJobs();
  </script>
</body>
</html>

[project]
name = "wellsynthai"
version = "0.1.0"
description = "PDF ingestion pipeline for well report documents"
requires-python = ">=3.11"
dependencies = [
    # Core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",

    # LLM / Orchestration
    "google-genai>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-text-splitters>=0.3.0",

    # PDF / OCR
    "PyMuPDF>=1.24.0",
    "pymupdf4llm>=1.27.0",

    # Vector DB
    "qdrant-client>=1.12.0",

    # Async / HTTP
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",

    # Logging
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
